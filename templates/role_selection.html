<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eMAR - Role Selection</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      .role-selection-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .role-selection-box {
        background: white;
        padding: 3rem;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 600px;
        width: 100%;
      }

      .role-selection-box h1 {
        color: #667eea;
        margin-bottom: 1rem;
        font-size: 2.5rem;
      }

      .role-selection-box p {
        color: #666;
        margin-bottom: 2rem;
        font-size: 1.1rem;
      }

      .role-buttons {
        display: flex;
        gap: 2rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .role-card {
        flex: 1;
        min-width: 200px;
        padding: 2rem;
        border: 3px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        color: #333;
        background: #f9f9f9;
      }

      .role-card:hover {
        border-color: #667eea;
        transform: translateY(-5px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
      }

      .role-card .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }

      .role-card h2 {
        color: #667eea;
        margin-bottom: 0.5rem;
      }

      .role-card p {
        color: #666;
        font-size: 0.9rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="role-selection-container">
      <div class="role-selection-box">
        <h1>Electronic Medication Administration Record</h1>
        <p>Please select your role to continue</p>
        
        <div class="role-buttons">
          <a href="{{ url_for('nurse_login') }}" class="role-card">
            <div class="icon">🧑‍⚕️</div>
            <h2>Nurse</h2>
            <p>Patient care and medication administration</p>
          </a>
          
          <a href="{{ url_for('management_login') }}" class="role-card">
            <div class="icon">📊</div>
            <h2>Management</h2>
            <p>Overview and Charts</p>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
