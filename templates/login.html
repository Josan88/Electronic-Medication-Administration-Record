<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Electronic Medication Administration Record</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      .login-container {
        max-width: 500px;
        margin: 100px auto;
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .login-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
        border-radius: 10px;
        margin-bottom: 2rem;
        text-align: center;
      }

      .login-header h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
      }

      .form-group select,
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      .form-group select:focus,
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1rem;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .btn-login:hover {
        transform: translateY(-2px);
      }

      .demo-credentials {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 1.5rem;
        margin-top: 1.5rem;
      }

      .demo-credentials h3 {
        color: #667eea;
        margin-bottom: 1rem;
        font-size: 1.1rem;
      }

      .credential-item {
        background: white;
        padding: 1rem;
        margin-bottom: 0.75rem;
        border-radius: 5px;
        border-left: 4px solid #667eea;
      }

      .credential-item:last-child {
        border-left-color: #764ba2;
      }

      .credential-item strong {
        color: #667eea;
        display: block;
        margin-bottom: 0.25rem;
      }

      .credential-item code {
        background: #f1f3f5;
        padding: 0.25rem 0.5rem;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        color: #495057;
      }

      .error-message {
        background: #fee;
        border: 2px solid #fcc;
        color: #c33;
        padding: 1rem;
        border-radius: 5px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>🏥 eMAR System</h1>
        <p>Electronic Medication Administration Record</p>
      </div>

      {% if error %}
      <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" class="login-form">
        <div class="form-group">
          <label for="user_type">User Type *</label>
          <select id="user_type" name="user_type" required>
            <option value="">Select User Type</option>
            <option value="nurse">Nurse</option>
            <option value="management">Management</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter password"
          />
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="demo-credentials">
        <h3>📋 Demo Credentials</h3>
        <p style="margin-bottom: 1rem; color: #6c757d; font-size: 0.9rem;">
          For demonstration purposes, use these credentials:
        </p>
        <div class="credential-item">
          <strong>Nurse Account</strong>
          <div>User Type: <code>Nurse</code></div>
          <div>Password: <code>nurse123</code></div>
        </div>
        <div class="credential-item">
          <strong>Management Account</strong>
          <div>User Type: <code>Management</code></div>
          <div>Password: <code>manager123</code></div>
        </div>
      </div>
    </div>
  </body>
</html>
